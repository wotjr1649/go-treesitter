name: API guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: api-guard-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api_guard: ${{ steps.classify.outputs.api_guard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit; HEAD^1..HEAD is exactly the files the pull request changes.
          fetch-depth: 2
      - id: classify
        name: Classify the changed files (tools/lane/ci_changes.py)
        run: python3 tools/lane/ci_changes.py --workflow api-guard

  api-guard:
    needs: changes
    if: ${{ needs.changes.outputs.api_guard == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The latest released root tag; set it to each new root tag in the post-release PR (docs/specs/publication.md, step 11).
      API_BASELINE_TAG: v0.7.0
      CGO_ENABLED: "0"
      GOENV: "off"
      GOWORK: "off"
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/apiguard/go.sum
      - name: Root API compatibility against the baseline tag
        run: |
          baseline="$RUNNER_TEMP/api-baseline"
          apidiff="$RUNNER_TEMP/apidiff"
          report="$RUNNER_TEMP/incompatible-api.txt"
          git worktree add --detach "$baseline" "refs/tags/$API_BASELINE_TAG"
          go -C tools/apiguard build -mod=readonly -o "$apidiff" golang.org/x/exp/cmd/apidiff
          (cd "$baseline" && "$apidiff" -w "$RUNNER_TEMP/release.api" .)
          "$apidiff" -w "$RUNNER_TEMP/head.api" .
          # apidiff reports incompatibilities on stdout and exits successfully.
          "$apidiff" -incompatible "$RUNNER_TEMP/release.api" "$RUNNER_TEMP/head.api" > "$report"
          if [ -s "$report" ]; then
            cat "$report"
            exit 1
          fi
          # apidiff does not report a field added to or reordered in a struct that other packages can write as an unkeyed literal.
          go -C tools/apiguard run -mod=readonly ./structliterals "$baseline" "$GITHUB_WORKSPACE"

  # The one required check of this workflow: red when the classifier or any job failed or was cancelled, green when every
  # job succeeded or was skipped on purpose (a skipped required check would otherwise pass even when its dependency failed).
  api-guard-gate:
    name: api-guard-gate
    if: ${{ always() }}
    needs: [changes, api-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -c 'map_values(.result)' <<<$NEEDS; jq -e --arg ok success --arg sk skipped 'all(.[]; .result == $ok or .result == $sk) and .changes.result == $ok' <<<$NEEDS
