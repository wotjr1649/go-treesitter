name: Comparative benchmark

# Compares this library with other Go tree-sitter libraries on identified inputs (tools/compare, plan S7/S10).
#
# Trigger: workflow_dispatch only, and only for the reviewed main branch: every job refuses any other ref.
#
# Threat model (tools/compare/README.md): the isolation boundary is the ephemeral GitHub-hosted runner VM of each job.
# The job protects the repository and its credentials: top-level permissions are empty and no job asks for any, there are no
# secrets, no id-token, no caches and no environment, the commit is fetched anonymously (the repository is public; checkout
# would need contents: read only for its token), actions are pinned by commit SHA, and nothing an artifact contains is ever
# executed or fed to a later privileged step. Candidates and the product run as the runner user in the same VM, which paired
# timing needs; the integrity of a number against a malicious candidate is NOT protected (it could falsify its own job's rows).
# Correctness is cross-checked against the native C reference, and the aggregate job validates every artifact with strict
# schemas and bounded reads.
#
# Module pins: tools/compare/adapters/*/go.mod. Their go.sum files must be committed before a measuring run:
#   1. Dispatch once with bootstrap=true. Only the proposal job runs: it resolves each module graph on a copy with
#      'go mod tidy' and uploads go-sum-proposal/. No candidate is built, run or measured.
#   2. Review the proposal and commit tools/compare/adapters/*/go.mod and go.sum to main.
#   3. Normal runs stop before any candidate step unless those files are committed, and fail if resolution would change them.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: full (plan repetitions) or smoke (reduced)
        type: choice
        options: [full, smoke]
        default: full
      bootstrap:
        description: Proposal only - resolve the adapters' module graphs and upload go.mod/go.sum proposals; nothing is measured
        type: boolean
        default: false

permissions: {}

concurrency:
  group: compare
  cancel-in-progress: false

env:
  GOENV: "off"
  GOWORK: "off"
  GOTOOLCHAIN: local
  MODE: ${{ inputs.mode }}

jobs:
  bootstrap:
    name: go.sum proposal (no measurement)
    if: ${{ github.ref == 'refs/heads/main' && inputs.bootstrap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      T: ${{ runner.temp }}/cmp
    steps:
      - name: Refuse any ref but main
        run: '[ "$GITHUB_REF" = refs/heads/main ]'
      - name: Fetch the commit (no token, no action)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Resolve the module graphs (executes no candidate code)
        env:
          STAGE_MODE: bootstrap
        run: bash tools/compare/scripts/stage.sh "$T" none
      - name: Upload the proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compare-go-sum-proposal
          path: ${{ runner.temp }}/cmp/out
          if-no-files-found: error
          retention-days: 14

  measure:
    name: measure (${{ matrix.runner }}, ${{ matrix.lang }})
    if: ${{ github.ref == 'refs/heads/main' && !inputs.bootstrap }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        lang: [c, go, javascript, json, python]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      T: ${{ runner.temp }}/cmp
    steps:
      - name: Refuse any ref but main
        run: '[ "$GITHUB_REF" = refs/heads/main ]'
      - name: Fetch the commit (no token, no action)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Stage the pinned inputs (stops here unless every go.sum is committed)
        run: bash tools/compare/scripts/stage.sh "$T" "${{ matrix.lang }}"
      - name: Build and measure (candidates run on this VM only)
        run: |
          budget=20; [ "$MODE" = smoke ] && budget=5
          bash tools/compare/scripts/measure.sh "$T" "${{ matrix.lang }}" "$MODE" "$budget"
      - name: Record the run's identity
        if: ${{ !cancelled() }}
        run: bash tools/compare/scripts/identity.sh "$T" "$MODE"
      - name: Upload the results (validated later, never executed)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compare-${{ matrix.runner }}-${{ matrix.lang }}
          path: ${{ runner.temp }}/cmp/out
          if-no-files-found: error
          retention-days: 14

  nocc:
    name: no-C-compiler build (${{ matrix.runner }})
    if: ${{ github.ref == 'refs/heads/main' && !inputs.bootstrap }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      T: ${{ runner.temp }}/cmp
    steps:
      - name: Refuse any ref but main
        run: '[ "$GITHUB_REF" = refs/heads/main ]'
      - name: Fetch the commit (no token, no action)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Stage the module cache and run the orchestrator's unit tests
        env:
          RUN_UNIT: "1"
        run: bash tools/compare/scripts/stage.sh "$T" none
      - name: Build every adapter with CGO_ENABLED=0 and no compiler on PATH, then smoke-parse
        run: |
          mkdir -p "$T/out"
          "$T/bin/compare" nocc -adapters tools/compare/adapters -go-bin "$T/go/bin" -modcache "$T/modcache" -out "$T/out/builds.csv"
      - name: Record the run's identity
        if: ${{ !cancelled() }}
        run: bash tools/compare/scripts/identity.sh "$T" "$MODE"
      - name: Upload the results (validated later, never executed)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compare-nocc-${{ matrix.runner }}
          path: ${{ runner.temp }}/cmp/out
          if-no-files-found: error
          retention-days: 14
      - name: The product must build and parse without a C compiler
        run: '"$T/bin/compare" gate-nocc -builds "$T/out/builds.csv"'

  aggregate:
    name: aggregate (no candidate code)
    needs: [measure, nocc]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.bootstrap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      T: ${{ runner.temp }}/cmp
    steps:
      - name: Refuse any ref but main
        run: '[ "$GITHUB_REF" = refs/heads/main ]'
      - name: Fetch only the orchestrator's sources (no adapter, no candidate module)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD -- tools/compare/cmd tools/compare/harness tools/compare/go.mod tools/compare/scripts/stage.sh tools/compare/scripts/pins.env tools/bench/proc
      - name: Build the aggregator
        env:
          STAGE_MODE: tools
        run: bash tools/compare/scripts/stage.sh "$T" none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: results
      - name: Validate every artifact with strict schemas and report (executes nothing from them)
        run: |
          "$T/bin/compare" aggregate -in results -out "$T/aggregate" || rc=$?
          [ -f "$T/aggregate/summary.md" ] && cat "$T/aggregate/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit ${rc:-0}
      - name: Upload the validated summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compare-summary
          path: ${{ runner.temp }}/cmp/aggregate
          if-no-files-found: error
          retention-days: 14
