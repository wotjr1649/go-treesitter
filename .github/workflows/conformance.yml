name: C-reference conformance (CI corpora)

# Compares the CGO-free engine with native C tree-sitter on inputs that need no local data: the pinned grammar
# repositories' own test/corpus files plus deterministic seeded edits (tools/native-ref/ciconf). The native reference
# is built here with the runner's gcc from the same pinned, sha256-verified sources (or restored from a main-push cache of that
# build, see "Native reference cache identity"); the Go side stays CGO_ENABLED=0.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's earlier unfinished first-attempt runs; main, scheduled, dispatched and
# re-run attempts never cancel and are never cancelled (same expressions as engine.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.run_attempt == 1 && 'main' || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == 1 }}

jobs:
  changes:
    name: conformance-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      conformance_full: ${{ steps.classify.outputs.conformance_full }}
      conformance_matrix: ${{ steps.classify.outputs.conformance_matrix }}
      expect: ${{ steps.classify.outputs.expect }}
      expect_matrix: ${{ steps.classify.outputs.expect_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit; HEAD^1..HEAD is exactly the files the pull request changes.
          fetch-depth: 2
      - id: classify
        name: Classify the changed files (tools/lane/ci_changes.py)
        run: |
          python3 -m unittest discover -s tools/lane -p test_ci_changes.py
          cc=tools/lane/ci_changes.py ev=$GITHUB_EVENT_NAME
          if [ $ev = pull_request ] && ! git diff --quiet HEAD^1 HEAD -- $cc; then ev=workflow_dispatch; fi
          python3 $cc --workflow conformance --event $ev

  conformance-grammar:
    name: conformance (${{ matrix.runner }}, ${{ matrix.group.name }})
    needs: changes
    strategy:
      fail-fast: false
      # Each job runs several grammars (one native build and one go test per job); the 25 grammars are split by measured run time
      # (CONFORMANCE_GROUPS in tools/lane/ci_changes.py). g1 also runs the repository-wide checks once per architecture (native-ref
      # unit tests, TestKnownGap*). A pull request that changes nothing the lane builds or runs keeps only g1 on ubuntu-24.04,
      # because TestKnownGap* reads every tracked file; main, dispatch and relevant changes run all five groups on both architectures.
      matrix: ${{ fromJSON(needs.changes.outputs.conformance_matrix) }}
    runs-on: ${{ matrix.runner }}
    # The step limits (go test 40m, query 40m, fuzz seeds 30m) sum to 110m; the job limit leaves room for setup and the
    # native build so a hung step fails at its own limit and the later !cancelled() steps still run. Expected: ~9-12m.
    timeout-minutes: 120
    env:
      GOENV: "off"
      GOWORK: "off"
      GOTOOLCHAIN: local
      GROUP_LANGS: ${{ matrix.group.langs }}
      GROUP_DOCS: ${{ matrix.group.docs }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x # newest supported; go.mod states the floor (1.26.0)
      - name: Native architecture
        run: |
          go env GOOS GOARCH
          test "$(go env GOOS)" = "${{ matrix.goos }}" && test "$(go env GOARCH)" = "${{ matrix.goarch }}" || { echo "native target mismatch"; exit 1; }
          gcc --version | head -1
      # Verified pinned archives (about 10 MB per group and architecture) are cached once per pins.json content: only a push to main
      # saves, pull requests restore. native-ref checks every archive in dl against its pinned sha256 before use, so a restored
      # file can only be accepted when its bytes equal the pin. The npm subdirectory is not cached.
      - name: Restore the verified archive cache
        id: dl-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/dl/*.gz
          key: conformance-dl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group.name }}-${{ hashFiles('tools/gen/pins.json') }}
      - name: Select the group's grammars for conformance builds
        run: |
          list=""
          for lang in $GROUP_LANGS; do
            [ "$lang" != golang ] || lang=go
            list="${list:+$list,}$lang"
          done
          echo "TSG_S15_LANGS=$list" >> "$GITHUB_ENV"
          tags=""
          for other in csharp go json python tsql tsx typescript javascript html css java c rust bash cpp yaml php powershell r dart xml ruby kotlin postgres swift; do
            case ",$list," in *",$other,"*) ;; *) tags="${tags:+$tags,}no_$other" ;; esac
          done
          echo "GOFLAGS=-tags=$tags" >> "$GITHUB_ENV"
      # The built native references (exe, corpus, queries, scanner patch stages; the build is ~24 of ~71 runner-minutes per push) are cached
      # like the archives: only a push to main saves, pull requests restore. The key holds everything that decides the build: runner OS,
      # architecture and image version, the compiler and Go versions, the group's grammar list, and the content of pins.json, the
      # native-ref sources, the patches and the Go packages native-ref imports, and this file. tools/native-ref/cachesums.sh records the
      # sha256 of every cached file and refuses a restore that differs, so a damaged entry falls back to the build below.
      - name: Native reference cache identity and key
        id: native-id
        env:
          GROUP_NAME: ${{ matrix.group.name }}
          INPUTS_HASH: ${{ hashFiles('tools/gen/pins.json', 'tools/gen/go.mod', 'tools/gen/go.sum', 'tools/gen/patches/**', 'tools/gen/grammarpatch/**', 'tools/bench/proc/**', 'tools/native-ref/**', '.github/workflows/conformance.yml') }}
        run: |
          ident=$(printf '%s\n' "${ImageOS:-}-${ImageVersion:-}" "$(gcc --version | head -1)" "$(go version)" "$GROUP_LANGS")
          printf '%s\n' "$ident"
          # A runner that states no image version is not cached. The key is computed once, here, before anything else runs, and reused
          # to restore and to save, so a file that changes during the job cannot make the two differ.
          if [ -n "${ImageVersion:-}" ]; then
            id=$(printf '%s' "$ident" | sha256sum | cut -c1-32)
            echo "id=$id" >> "$GITHUB_OUTPUT"
            echo "key=conformance-native-$RUNNER_OS-$RUNNER_ARCH-$GROUP_NAME-$id-$INPUTS_HASH" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Restore the built native references
        id: native-cache
        if: ${{ steps.native-id.outputs.id != '' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/exe
            ${{ runner.temp }}/corpus
            ${{ runner.temp }}/queries
            ${{ runner.temp }}/scanner-stages
            ${{ runner.temp }}/native-cache.sums
          key: ${{ steps.native-id.outputs.key }}
      - name: Verify the restored native references
        id: native-ready
        # The archives must be restored too: the YAML patch comparison below compiles the unpatched grammar from them.
        if: ${{ steps.native-cache.outputs.cache-hit == 'true' && steps.dl-cache.outputs.cache-hit == 'true' }}
        run: |
          if bash tools/native-ref/cachesums.sh check "$RUNNER_TEMP"; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "native references restored from the cache: $(sed -n 2p "$RUNNER_TEMP/native-cache.sums")" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the restored native references do not match their recorded checksums; building them. This cache entry stays unusable (an existing key cannot be overwritten) until the key changes"
            rm -rf "$RUNNER_TEMP/exe" "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/queries" "$RUNNER_TEMP/scanner-stages"
          fi
      - name: Build the native-ref and ciconf tools
        working-directory: tools/native-ref
        env:
          CGO_ENABLED: "0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [ "$GROUP_DOCS" != true ] || go test -count=1 ./...
          go build -o "$RUNNER_TEMP/native-ref" .
          go build -o "$RUNNER_TEMP/ciconf" ./ciconf
      # Archives are fetched from the pinned commits and their sha256 checked against tools/gen/pins.json before use.
      - name: Fetch pinned sources, build native references, extract corpus and queries
        if: ${{ steps.native-ready.outputs.usable != 'true' }}
        env:
          CGO_ENABLED: "0"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/native-ref" -pins tools/gen/pins.json -fetch -cc gcc \
            -dl "$RUNNER_TEMP/dl" -work "$RUNNER_TEMP/work" -out "$RUNNER_TEMP/exe" -corpus "$RUNNER_TEMP/corpus" -queries "$RUNNER_TEMP/queries" \
            -scanner-stages "$RUNNER_TEMP/scanner-stages" $GROUP_LANGS
      - name: Record the native build for the cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-id.outputs.id != '' && steps.native-cache.outputs.cache-hit != 'true' }}
        run: bash tools/native-ref/cachesums.sh write "$RUNNER_TEMP"
      - name: Extract inputs and edits, record native results
        id: native-inputs
        env:
          CGO_ENABLED: "0"
        run: |
          "$RUNNER_TEMP/ciconf" -pins tools/gen/pins.json -corpus "$RUNNER_TEMP/corpus" -exe "$RUNNER_TEMP/exe" -out "$RUNNER_TEMP/data" -lang "$TSG_S15_LANGS" -kit tools/conformance/testdata/kit
      - name: YAML patch comparison against the original upstream grammar
        if: ${{ contains(matrix.group.langs, 'yaml') }}
        working-directory: tools/native-ref
        env:
          CGO_ENABLED: "0"
        run: |
          go run . -pins ../gen/pins.json -dl "$RUNNER_TEMP/dl" \
            -work "$RUNNER_TEMP/unpatched-work" -out "$RUNNER_TEMP/unpatched-exe" -unpatched yaml
          go run ./patchcompare -before "$RUNNER_TEMP/unpatched-exe/yaml" -after "$RUNNER_TEMP/exe/yaml" \
            -corpus "$RUNNER_TEMP/data/corpus/yaml" -fuzz-source ../conformance/fuzz_test.go \
            -fuzz-target FuzzParseYAML -allow-nul-truncation -out "$RUNNER_TEMP/patch-comparison"
      - name: Upload YAML patch comparison
        if: ${{ always() && contains(matrix.group.langs, 'yaml') }}
        uses: actions/upload-artifact@v7
        with:
          name: yaml-patch-comparison-${{ matrix.runner }}
          path: ${{ runner.temp }}/patch-comparison
          if-no-files-found: warn
          retention-days: 90
      - name: Go conformance against the native results
        working-directory: tools/conformance
        env:
          CGO_ENABLED: "0"
          TSG_DATA_DIR: ${{ runner.temp }}/data
          TSG_NATIVE_EXE_DIR: ${{ runner.temp }}/exe
          TSG_REQUIRE_FIELD_LOOKUP: "1"
        # TestKnownGaps is per grammar; the other TestKnownGap* tests (register documents, links, ratchet) are repository-wide and run in g1 only.
        run: |
          known=TestKnownGaps
          [ "$GROUP_DOCS" != true ] || known=TestKnownGap
          go test -count=1 -timeout 40m -v -run "TestCorpus|TestEdits|TestFieldLookup|TestParserPoolRealEngine|TestMemoryLimitRealEngine|$known|TestHeredocUTF8|TestScannerPatches|TestSymbolLookupNative" .
      # Query raw matches: every grammar's own queries/*.scm (pinned archive, sha256-verified) plus structural probes,
      # over the corpus inputs, byte-identical to `<native exe> query` (docs/design/query-abi.md, "Verification").
      # The HTML grammar in g5 also checks per-call match limits on the Go engine.
      # The comparison with the tree-sitter CLI (predicates) is local only: TestQueryCLI skips without TSG_TS_CLI.
      - name: Query raw matches against native C
        if: ${{ !cancelled() }}
        working-directory: tools/conformance
        env:
          CGO_ENABLED: "0"
          TSG_DATA_DIR: ${{ runner.temp }}/data
          TSG_NATIVE_EXE_DIR: ${{ runner.temp }}/exe
          TSG_QUERY_DIR: ${{ runner.temp }}/queries
          TSG_QUERY_PROBE_STRIDE: "1"
        run: go test -count=1 -timeout 40m -v -run 'TestStripPredicates|TestQueryNative|TestQueryCLIInvalidUTF8Output|TestQueryMatchLimitIsPerCall' .
      # Run fuzz seed corpora once without fuzzing. Go examples build in g2 (!no_go).
      - name: Fuzz seed corpora
        if: ${{ !cancelled() }}
        working-directory: tools/conformance
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -timeout 1800s -run 'Fuzz|^Example' .
      - name: Check reviewed native scanner patch differences (ADR-0023)
        if: ${{ !cancelled() && steps.native-inputs.outcome == 'success' }}
        working-directory: tools/native-ref
        env:
          CGO_ENABLED: "0"
        run: |
          ulimit -c 0
          status=0
          for lang in $GROUP_LANGS; do
            corpus=$lang
            [ "$corpus" != golang ] || corpus=go
            echo "::group::scanner patch comparison: $lang"
            go run ./patchcompare -scanner-build "$RUNNER_TEMP/scanner-stages/$lang.json" \
              -expectations "../gen/patches/$lang/scanner-expectations.json" \
              -corpus "$RUNNER_TEMP/data/corpus/$corpus" -fuzz-source ../conformance/fuzz_test.go \
              -regressions ../conformance/testdata -out "$RUNNER_TEMP/scanner-comparison/$lang" || { echo "::error::scanner patch comparison failed: $lang"; status=1; }
            echo "::endgroup::"
          done
          exit $status
      - name: Upload native scanner patch comparison
        if: ${{ !cancelled() && steps.native-inputs.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: scanner-patch-comparison-${{ matrix.runner }}-${{ matrix.group.name }}
          path: |
            ${{ runner.temp }}/scanner-comparison
            ${{ runner.temp }}/data/corpus/manifest.csv
            ${{ runner.temp }}/data/corpus/skipped.csv
          if-no-files-found: ignore
          retention-days: 90
      - name: Check the native references are unchanged before saving
        id: native-final
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-id.outputs.id != '' && steps.native-cache.outputs.cache-hit != 'true' }}
        run: |
          if bash tools/native-ref/cachesums.sh check "$RUNNER_TEMP"; then echo "ok=true" >> "$GITHUB_OUTPUT"; du -sh "$RUNNER_TEMP/exe" "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/queries" "$RUNNER_TEMP/scanner-stages"; else echo "::warning::the native references changed after the build; not caching them"; fi
      - name: Save the built native references
        if: ${{ steps.native-final.outputs.ok == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/exe
            ${{ runner.temp }}/corpus
            ${{ runner.temp }}/queries
            ${{ runner.temp }}/scanner-stages
            ${{ runner.temp }}/native-cache.sums
          key: ${{ steps.native-id.outputs.key }}
      - name: Save the verified archive cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dl-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/dl/*.gz
          key: conformance-dl-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group.name }}-${{ hashFiles('tools/gen/pins.json') }}

  # Required check names kept until the ruleset requires conformance-gate. They no longer prove that the arm64 jobs ran on a
  # reduced pull request (see the matrix above); conformance-gate is the single check that carries the meaning.
  conformance:
    name: conformance (${{ matrix.runner }})
    if: ${{ always() }}
    needs: [changes, conformance-grammar]
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: All grammar shards passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a needed job ended $r"; exit 1; }; done

  # The one required check of this workflow: red when the classifier or any job failed or was cancelled, green when every
  # job succeeded or was skipped on purpose (a skipped required check would otherwise pass even when its dependency failed).
  conformance-gate:
    name: conformance-gate
    if: ${{ always() }}
    needs: [changes, conformance-grammar, conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # list the jobs of this run
    steps:
      - name: Every needed job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -c 'map_values(.result)' <<<$NEEDS; jq -e --arg ok success --arg sk skipped '. as $n | all(.[]; .result == $ok or .result == $sk) and .changes.result == $ok and all(.changes.outputs.expect | fromjson[]; $n[.].result == $ok)' <<<$NEEDS
      # The needed jobs above are one result per matrix, so a matrix that came out smaller than it should (a classifier regression) stays green.
      # Count the successful instances in the run: they must be exactly the ones the classifier listed and, outside pull requests, the full
      # matrix (10 jobs; test_ci_changes.py ties the number to the partitions).
      - name: The successful matrix jobs are the expected instances
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: ${{ needs.changes.outputs.expect_matrix }}
          MATRIX_RE: '^conformance \([^,)]+, g[0-9]+\)$'
          FULL: ${{ github.event_name != 'pull_request' && '10' || '' }}
        run: |
          want=$(jq -nr --argjson e "$EXPECT" '$e[]' | tr -d '\r' | sort)
          [ -z "$FULL" ] || [ "$(jq -n --argjson e "$EXPECT" '$e | length')" = "$FULL" ] || { echo "::error::the classifier listed $(jq -n --argjson e "$EXPECT" '$e | length') matrix jobs, the full run has $FULL"; exit 1; }
          ok=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name' | { grep -E "$MATRIX_RE" || true; } | sort)
          [ "$ok" = "$want" ] || { echo "::error::the successful matrix jobs differ from the expected ones (< successful, > expected)"; diff <(echo "$ok") <(echo "$want"); exit 1; }
