name: Engine cross-platform lane

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.run_attempt == 1 && 'main' || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == 1 }}

env:
  GOENV: "off"
  GOWORK: "off"
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: engine-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      engine_core: ${{ steps.classify.outputs.engine_core }}
      engine_platforms: ${{ steps.classify.outputs.engine_platforms }}
      engine_grammars: ${{ steps.classify.outputs.engine_grammars }}
      engine_floor: ${{ steps.classify.outputs.engine_floor }}
      engine_compat: ${{ steps.classify.outputs.engine_compat }}
      engine_shards: ${{ steps.classify.outputs.engine_shards }}
      floor_shards: ${{ steps.classify.outputs.floor_shards }}
      expect: ${{ steps.classify.outputs.expect }}
      expect_matrix: ${{ steps.classify.outputs.expect_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit; HEAD^1..HEAD is exactly the files the pull request changes.
          fetch-depth: 2
      - id: classify
        name: Classify the changed files (tools/lane/ci_changes.py)
        run: |
          python3 -m unittest discover -s tools/lane -p test_ci_changes.py
          cc=tools/lane/ci_changes.py ev=$GITHUB_EVENT_NAME
          if [ $ev = pull_request ]; then git show HEAD^1:$cc > $RUNNER_TEMP/base_ci_changes.py 2>/dev/null && cc=$RUNNER_TEMP/base_ci_changes.py || ev=workflow_dispatch; fi
          python3 $cc --workflow engine --event $ev

  # Pull requests run ubuntu-24.04 and windows-latest (engine and grammar shards), the Go 1.26 floor on the root and one shard,
  # and the cross-compat lane; pushes to main, dispatch and a change to this file run all five platforms and the floor on every shard.
  engine-linux-amd64:
    needs: [changes, grammar-linux-amd64]
    # Always start when selected: the first step fails the job unless every grammar shard succeeded or was skipped on purpose.
    if: ${{ always() && needs.changes.outputs.engine_core == 'true' }}
    name: engine (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: &linux_amd64_env
      CGO_ENABLED: "0"
      EXPECTED_GOOS: linux
      EXPECTED_GOARCH: amd64
      GO_VERSION: 1.27.x
    steps: &engine_steps
      - name: Grammar shards passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SHARDS_WANTED: ${{ needs.changes.outputs.engine_grammars }}
        run: &shards_passed |
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              skipped) [ "$SHARDS_WANTED" != true ] || { echo "grammar shards were skipped but are needed"; exit 1; } ;;
              *) echo "a needed job ended $r"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }} # newest supported; go.mod now states the floor (1.26.0), see engine-go126
      - name: Native architecture
        run: |
          go env GOOS GOARCH CGO_ENABLED
          test "$(go env GOOS)" = "$EXPECTED_GOOS" && test "$(go env GOARCH)" = "$EXPECTED_GOARCH" || { echo "native target mismatch"; exit 1; }
      - name: Engine and root package
        run: |
          go vet ./internal/engine ./internal/langid ./experimental/... .
          go test -count=1 -timeout 600s ./internal/engine ./internal/langid ./experimental/... .
      # windows.yml's product job (go build/vet/test ./... on both Windows architectures) ran only what the steps above and the grammar
      # shards already cover, plus this cross-compile: a pull request has no native windows/arm64 job, so the amd64 job compiles for it.
      - name: Cross-build windows/arm64
        if: ${{ !cancelled() && env.EXPECTED_GOOS == 'windows' && env.EXPECTED_GOARCH == 'amd64' }}
        env:
          GOOS: windows
          GOARCH: arm64
        run: go build ./...
      - name: Subprocess tree supervision
        if: ${{ !cancelled() }}
        working-directory: tools/bench/proc
        run: |
          go vet ./...
          go test -count=1 -timeout 120s -v ./...
      - name: Python subprocess and gate regression tests
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s tools/native-ref -p '*_test.py'
      - name: Lane receipt and classifier tests
        if: ${{ !cancelled() }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s tools/lane -p 'test_*.py'
      - name: Generator unit tests
        if: ${{ !cancelled() }}
        working-directory: tools/gen
        run: go test -count=1 -timeout 300s ./...
      # The generator downloads regex-syntax 0.8.11 and verifies its pinned SHA-256 before comparing bytes.
      - name: Query Unicode generated files
        if: ${{ !cancelled() }}
        working-directory: tools/gen
        run: go run ./queryunicode -root ../.. -check
      # Its tests need the local session data tree (TSG_S15_DIR) and skip, so only vet runs here.
      - name: Conformance module (vet only)
        if: ${{ !cancelled() }}
        working-directory: tools/conformance
        run: go vet ./...

  engine-linux-arm64:
    needs: [changes, grammar-linux-arm64]
    if: ${{ always() && needs.changes.outputs.engine_platforms == 'true' && needs.changes.outputs.full == 'true' }}
    name: engine (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env: &linux_arm64_env
      CGO_ENABLED: "0"
      EXPECTED_GOOS: linux
      EXPECTED_GOARCH: arm64
      GO_VERSION: 1.27.x
    steps: *engine_steps

  engine-macos-arm64:
    needs: [changes, grammar-macos-arm64]
    if: ${{ always() && needs.changes.outputs.engine_platforms == 'true' && needs.changes.outputs.full == 'true' }}
    name: engine (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    env: &macos_arm64_env
      CGO_ENABLED: "0"
      EXPECTED_GOOS: darwin
      EXPECTED_GOARCH: arm64
      GO_VERSION: 1.27.x
    steps: *engine_steps

  engine-windows-amd64:
    needs: [changes, grammar-windows-amd64]
    if: ${{ always() && needs.changes.outputs.engine_platforms == 'true' }}
    name: engine (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    env: &windows_amd64_env
      CGO_ENABLED: "0"
      EXPECTED_GOOS: windows
      EXPECTED_GOARCH: amd64
      GO_VERSION: 1.27.x
    steps: *engine_steps

  engine-windows-arm64:
    needs: [changes, grammar-windows-arm64]
    if: ${{ always() && needs.changes.outputs.engine_platforms == 'true' && needs.changes.outputs.full == 'true' }}
    name: engine (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 45
    env: &windows_arm64_env
      CGO_ENABLED: "0"
      EXPECTED_GOOS: windows
      EXPECTED_GOARCH: arm64
      GO_VERSION: 1.27.x
    steps: *engine_steps

  # The oldest supported Go (go.mod floor 1.26): engine, root package and grammar modules must build and pass there too.
  # Pull requests run the root plus shard 1; main runs every shard (floor_shards).
  engine-go126:
    needs: [changes, grammar-go126]
    if: ${{ always() && needs.changes.outputs.engine_floor == 'true' }}
    name: engine, oldest supported Go (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: &go126_env
      CGO_ENABLED: "0"
      EXPECTED_GOOS: linux
      EXPECTED_GOARCH: amd64
      GO_VERSION: 1.26.x
    steps:
      - name: Grammar shards passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SHARDS_WANTED: ${{ needs.changes.outputs.engine_floor }}
        run: *shards_passed
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go version
        run: go version | grep -q 'go1\.26\.' || { echo "expected Go 1.26.x"; exit 1; }
      - name: Engine and root package
        run: |
          go vet ./internal/engine ./internal/langid ./experimental/... .
          go test -count=1 -timeout 600s ./internal/engine ./experimental/... .

  engine-consumer-compat:
    needs: changes
    if: ${{ needs.changes.outputs.engine_compat == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: false
      - name: Published grammar consumers
        run: |
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64
          dir="$RUNNER_TEMP/engine-consumer-compat"
          mkdir -p "$dir"
          python3 tools/lane/consumer_compat.py "$dir" 2>&1 | tee "$dir/run.log"
      - name: Consumer evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: engine-consumer-compat
          path: ${{ runner.temp }}/engine-consumer-compat/

  # The shard lists live in tools/lane/ci_changes.py (ENGINE_SHARDS); the classifier fails unless they name every grammars/* directory once.
  grammar-linux-amd64:
    name: grammar (ubuntu-24.04, Go 1.27.x, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.engine_grammars == 'true' }}
    strategy: &grammar_strategy
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.engine_shards) }}
    runs-on: ubuntu-24.04
    # Allow all five grammar test timeouts plus checkout and Go setup.
    timeout-minutes: 90
    env: *linux_amd64_env
    steps: &grammar_steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Native architecture
        run: test "$(go env GOOS)" = "$EXPECTED_GOOS" && test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
      - name: Grammar module embedded sample tests
        env:
          GRAMMARS: ${{ matrix.grammars }}
        run: |
          [ -n "$GRAMMARS" ] || { echo "::error::empty grammar shard"; exit 1; }
          unset TSG_CORPUS
          read -r -a grammars <<< "$GRAMMARS"
          result=0
          for lang in "${grammars[@]}"; do
            echo "::group::$lang"
            (cd "grammars/$lang" && go test -count=1 -timeout 900s .) || result=1
            echo "::endgroup::"
          done
          exit "$result"

  grammar-linux-arm64:
    name: grammar (ubuntu-24.04-arm, Go 1.27.x, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.engine_grammars == 'true' && needs.changes.outputs.full == 'true' }}
    strategy: *grammar_strategy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env: *linux_arm64_env
    steps: *grammar_steps

  grammar-macos-arm64:
    name: grammar (macos-latest, Go 1.27.x, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.engine_grammars == 'true' && needs.changes.outputs.full == 'true' }}
    strategy: *grammar_strategy
    runs-on: macos-latest
    timeout-minutes: 90
    env: *macos_arm64_env
    steps: *grammar_steps

  grammar-windows-amd64:
    name: grammar (windows-latest, Go 1.27.x, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.engine_grammars == 'true' }}
    strategy: *grammar_strategy
    runs-on: windows-latest
    timeout-minutes: 90
    env: *windows_amd64_env
    steps: *grammar_steps

  grammar-windows-arm64:
    name: grammar (windows-11-arm, Go 1.27.x, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.engine_grammars == 'true' && needs.changes.outputs.full == 'true' }}
    strategy: *grammar_strategy
    runs-on: windows-11-arm
    timeout-minutes: 90
    env: *windows_arm64_env
    steps: *grammar_steps

  grammar-go126:
    name: grammar (ubuntu-24.04, Go 1.26.x, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.engine_floor == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.floor_shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env: *go126_env
    steps: *grammar_steps

  # The one required check of this workflow: red when the classifier or any job failed or was cancelled, green when every
  # job succeeded or was skipped on purpose (a skipped required check would otherwise pass even when its dependency failed).
  engine-gate:
    name: engine-gate
    permissions:
      actions: read # list the jobs of this run
    if: ${{ always() }}
    needs: [changes, engine-linux-amd64, engine-linux-arm64, engine-macos-arm64, engine-windows-amd64, engine-windows-arm64, engine-go126, engine-consumer-compat, grammar-linux-amd64, grammar-linux-arm64, grammar-macos-arm64, grammar-windows-amd64, grammar-windows-arm64, grammar-go126]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -c 'map_values(.result)' <<<$NEEDS; jq -e --arg ok success --arg sk skipped '. as $n | all(.[]; .result == $ok or .result == $sk) and .changes.result == $ok and all(.changes.outputs.expect | fromjson[]; $n[.].result == $ok)' <<<$NEEDS
      # The needed jobs above are one result per matrix, so a matrix that came out smaller than it should (a classifier regression) stays green.
      # Count the successful instances in the run: they must be exactly the ones the classifier listed and, outside pull requests, the full
      # matrix (30 jobs; test_ci_changes.py ties the number to the partitions).
      - name: The successful matrix jobs are the expected instances
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: ${{ needs.changes.outputs.expect_matrix }}
          MATRIX_RE: '^grammar \('
          FULL: ${{ github.event_name != 'pull_request' && '30' || '' }}
        run: |
          want=$(jq -nr --argjson e "$EXPECT" '$e[]' | tr -d '\r' | sort)
          [ -z "$FULL" ] || [ "$(jq -n --argjson e "$EXPECT" '$e | length')" = "$FULL" ] || { echo "::error::the classifier listed $(jq -n --argjson e "$EXPECT" '$e | length') matrix jobs, the full run has $FULL"; exit 1; }
          ok=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name' | { grep -E "$MATRIX_RE" || true; } | sort)
          [ "$ok" = "$want" ] || { echo "::error::the successful matrix jobs differ from the expected ones (< successful, > expected)"; diff <(echo "$ok") <(echo "$want"); exit 1; }
