name: Nightly CLI rehearsal

# Weekly, REPORT ONLY (ADR-0027, "Nightly rehearsal"): regenerates every grammar with the tree-sitter `nightly` release CLI
# and compares the generated files with those of the pinned CLI (tools/gen/pins.json) from the same inputs and patches:
# which of parser.c / grammar.json / node-types.json / other files differ, the node-types schema diff summary, and the
# nightly CLI's identity (asset URL, size, SHA-256 of the asset and of the binary, release API digest, tag commit, --version).
# The nightly bytes have no pin; their identity is recorded and cross-checked (API size/digest against the file, the --version
# build commit against the tag; a mismatch holds the comparison and turns the run red), and the product path (regen.yml,
# regen.sh) stays pinned and hash-verified. The nightly CLI runs only inside bubblewrap (tools/gen/nightly-sandbox.sh): no
# network, no token, no environment, no runner files, the call's inputs read-only and only its --output directory writable. Nothing here edits the
# repository, opens a PR or gates a PR: a difference is a result, not a failure (only a broken harness or a held identity turns
# the run red). Output: job summary, artifact, and one comment on the tracking issue (#67) only when the per-grammar results
# changed since the last comment.
# It does not run the conformance corpus: that comparison needs the native build lane and belongs to the pin-move PR.

on:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-cli-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GOENV: "off"
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x # newest supported; go.mod states the floor (1.26.0)
          cache: false # nothing from this job is reused by other workflows
      - name: Unit tests of the rehearsal report and the unpinned CLI path
        working-directory: tools/gen
        run: go test -count=1 -run '^(TestCompareOutputs|TestSchemaSummary|TestNodeTypesSchema|TestRehearsal.*|TestNightlyIdentityProblems|TestCheckCLIUnpinned|TestCheckInputs.*|TestImportGenerated|TestUnpinnedGenerateEnvironment)$' . ./grammarpatch
      - name: Fetch and verify the pinned CLI and grammar archives
        run: bash tools/gen/nightly-rehearsal.sh fetch "$RUNNER_TEMP/rehearsal"
      # The only step with a token: read-only release metadata of the public tree-sitter repository. Nothing runs the asset here.
      - name: Read the nightly release metadata and download the asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/gen/nightly-rehearsal.sh nightly "$RUNNER_TEMP/rehearsal"
      # bubblewrap needs unprivileged user namespaces, which Ubuntu 24.04's AppArmor restricts; this VM is discarded after the job.
      - name: Prepare and check the sandbox for the nightly CLI
        env:
          GH_TOKEN: not-a-token # must not reach the sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Self-check with bash in the nightly binary's place and the mount layout of a real generate call (grammarpatch:
          # tree Work/first read-only, Work/first.out writable, Work/second beside them).
          t="$RUNNER_TEMP/sandbox-check/work"
          mkdir -p "$t/first/src" "$t/second/src" "$t/first.out"
          echo 'module.exports = 0;' > "$t/first/src/grammar.js"
          echo other > "$t/second/src/grammar.js"
          (cd "$t/first" && TS_GENERATE_INPUT="$t/first" TS_GENERATE_OUTPUT="$t/first.out" NIGHTLY_BIN=/usr/bin/bash \
            bash "$GITHUB_WORKSPACE/tools/gen/nightly-sandbox.sh" -c '
              [ -z "${GH_TOKEN:-}${GITHUB_ENV:-}${RUNNER_TEMP:-}" ] &&
              [ -r src/grammar.js ] && ! (echo x >> src/grammar.js) 2>/dev/null && ! touch src/new 2>/dev/null &&
              [ ! -e "$2" ] && [ ! -e "$3" ] && [ ! -e "$4" ] && [ "$(ls -A "$5")" = work ] &&
              ! (exec 3<>/dev/tcp/140.82.112.3/443) 2>/dev/null &&
              echo ok > "$1/written"' check "$t/first.out" "$t/second" "$GITHUB_ENV" "$GITHUB_WORKSPACE" "$HOME")
          # Outside again: the output was written, the inputs were not. Each check fails the step on its own.
          [ "$(cat "$t/first.out/written" 2>/dev/null)" = ok ] || { echo "::error::sandbox check: the output was not written"; exit 1; }
          [ ! -e "$t/first/src/new" ] || { echo "::error::sandbox check: a file was created in the read-only input"; exit 1; }
          [ "$(cat "$t/first/src/grammar.js")" = 'module.exports = 0;' ] || { echo "::error::sandbox check: the read-only input changed"; exit 1; }
          rm -rf "$RUNNER_TEMP/sandbox-check"
      - name: Regenerate every grammar with the pinned and the nightly CLI
        run: bash tools/gen/nightly-rehearsal.sh run "$RUNNER_TEMP/rehearsal" | tee "$RUNNER_TEMP/rehearsal.log" | tail -n 40
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/rehearsal/out"
          if [ -f "$out/summary.md" ]; then
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Nightly download facts</summary>" >> "$GITHUB_STEP_SUMMARY"
            { echo; echo '```json'; cat "$RUNNER_TEMP/rehearsal/nightly-meta.json"; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The rehearsal produced no report; see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-cli-rehearsal
          path: |
            ${{ runner.temp }}/rehearsal/out
            ${{ runner.temp }}/rehearsal/nightly-meta.json
            ${{ runner.temp }}/rehearsal/plan.tsv
          if-no-files-found: warn
          retention-days: 30

  # Separate job so that only it holds issues: write; it runs no repository code, only the gh CLI and jq (as upstream-watch.yml does).
  # It runs only after a successful rehearsal, and fails visibly, without commenting, when a lookup fails.
  issue:
    needs: rehearse
    if: ${{ needs.rehearse.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TRACKING_ISSUE: "67" # "Move pinned tree-sitter CLI/runtime to 0.28.0 when released"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nightly-cli-rehearsal
          path: ${{ runner.temp }}/report
      - name: Comment on the tracking issue when the results changed
        run: |
          out="$RUNNER_TEMP/report/out"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          default=$(gh api "repos/$GH_REPO" --jq .default_branch)
          if [ -z "$default" ]; then echo "::error::default branch lookup failed"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != "$default" ]; then
            echo "run on $GITHUB_REF_NAME, not the default branch '$default': the tracking issue is left unchanged"
            exit 0
          fi
          # A valid report: verified nightly identity, a 64-hex digest that report.json and digest.txt agree on, a summary.
          digest=$(tr -d '\n' < "$out/digest.txt")
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::malformed digest"; exit 1; }
          [ -s "$out/summary.md" ] || { echo "::error::empty summary"; exit 1; }
          jq -e --arg d "$digest" '.kind == "nightly-rehearsal" and .reportOnly == true and .nightly.identity == "verified" and .digest == $d' \
            "$out/report.json" >/dev/null || { echo "::error::report.json is not a verified rehearsal report for digest $digest"; exit 1; }
          state=$(gh issue view "$TRACKING_ISSUE" --json state --jq .state)
          if [ "$state" != OPEN ]; then
            echo "issue #$TRACKING_ISSUE is $state: nothing to update (the report stays in the artifact)"
            exit 0
          fi
          # Only this workflow's own comments count, with the marker at the very end of the body. A failed lookup stops here.
          if ! found=$(gh api "repos/$GH_REPO/issues/$TRACKING_ISSUE/comments" --paginate --jq \
            '.[] | select(.user.login == "github-actions[bot]") | .body | capture("<!-- nightly-cli-rehearsal digest=(?<d>[0-9a-f]{64}) -->\\s*\\z") | .d'); then
            echo "::error::reading the comments of #$TRACKING_ISSUE failed: no comment written"
            exit 1
          fi
          last=$(printf '%s\n' "$found" | tail -n 1)
          if [ "$last" = "$digest" ]; then
            echo "results unchanged since the last comment ($digest): no comment"
            exit 0
          fi
          { cat "$out/summary.md"; printf '\n[Workflow run](%s) · report-only weekly rehearsal, see `tools/gen/README.md`.\n<!-- nightly-cli-rehearsal digest=%s -->\n' "$run" "$digest"; } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$TRACKING_ISSUE" --body-file "$RUNNER_TEMP/comment.md"
