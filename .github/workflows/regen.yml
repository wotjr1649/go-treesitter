name: Regeneration drift check

# Regenerates every grammar module on Linux from the pinned upstream sources and tools (tools/gen/pins.json) and
# requires the result to equal the committed bytes, which were generated on Windows. A difference means the
# generation is not host independent, or a pin and the committed modules disagree.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == 1 }}

jobs:
  changes:
    name: regen-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      regen: ${{ steps.classify.outputs.regen }}
      expect: ${{ steps.classify.outputs.expect }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit; HEAD^1..HEAD is exactly the files the pull request changes.
          fetch-depth: 2
      - id: classify
        name: Classify the changed files (tools/lane/ci_changes.py)
        run: |
          python3 -m unittest discover -s tools/lane -p test_ci_changes.py
          cc=tools/lane/ci_changes.py ev=$GITHUB_EVENT_NAME
          if [ $ev = pull_request ]; then git show HEAD^1:$cc > $RUNNER_TEMP/base_ci_changes.py 2>/dev/null && cc=$RUNNER_TEMP/base_ci_changes.py || ev=workflow_dispatch; fi
          python3 $cc --workflow regen --event $ev

  regen-grammar:
    name: regenerate ${{ matrix.lang }} and diff (ubuntu-24.04)
    needs: changes
    if: ${{ needs.changes.outputs.regen == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        lang: [csharp, golang, json, python, tsql, tsx, typescript, javascript, html, css, java, c, rust, bash, cpp, yaml, php, powershell, r, dart, xml, ruby, kotlin, postgres, swift]
    runs-on: ubuntu-24.04
    # PostgreSQL builds patched and upstream-LFS variants independently; retain the 90-minute shard budget.
    timeout-minutes: ${{ matrix.lang == 'postgres' && 90 || 60 }}
    env:
      CGO_ENABLED: "0"
      GOENV: "off"
      GOWORK: "off"
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x # newest supported; go.mod states the floor (1.26.0)
      - name: Transient fetch retry regression checks
        run: bash tools/gen/fetch_test.sh
      # Verified archives (wasi-sdk, binaryen, the CLI, the runtime, wasi-libc and the 25 grammars, a few hundred MB) are cached
      # once per pins.json content. Only a push to main saves; pull requests restore. fetch.sh still checks every restored
      # file against its pinned sha256 (TSG_DL_CACHE), so the key selects files, never their bytes.
      - name: Restore the verified archive cache
        id: dl-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/dl-cache
          key: regen-dl-${{ runner.os }}-${{ hashFiles('tools/gen/pins.json') }}
      # Downloads each pinned archive into a new empty directory and checks its sha256 before extracting;
      # builds wasm2go from its pinned module version; regenerates the selected module into grammars/.
      - name: Regenerate grammar modules
        env:
          TSG_DL_CACHE: ${{ runner.temp }}/dl-cache
        run: /usr/bin/time -v -o "$RUNNER_TEMP/regen-cost.txt" bash tools/gen/regen.sh "$RUNNER_TEMP/regen" "${{ matrix.lang }}"
      # One shard saves (every shard downloads the same set), and only when main's pins.json has no cache yet.
      - name: Save the verified archive cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.lang == 'json' && steps.dl-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/dl-cache
          key: regen-dl-${{ runner.os }}-${{ hashFiles('tools/gen/pins.json') }}
      - name: Build generator behaviour gate tools
        run: |
          (cd tools/native-ref && go build -trimpath -o "$RUNNER_TEMP/native-ref" . && go build -trimpath -o "$RUNNER_TEMP/ciconf" ./ciconf)
          (cd tools/bench && go build -trimpath -o "$RUNNER_TEMP/benchci" ./ci)
          python3 -m unittest discover -s tools/native-ref -p 'generatorgate_test.py'
      - name: Compare regenerated and reference C behaviour (ADR-0027)
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/generator-gate-cost.txt" \
            python3 tools/native-ref/generatorgate.py --lang "${{ matrix.lang }}" \
              --native-ref "$RUNNER_TEMP/native-ref" --ciconf "$RUNNER_TEMP/ciconf" --benchci "$RUNNER_TEMP/benchci" \
              --cli "$RUNNER_TEMP/regen/bin/tree-sitter" --dl "$RUNNER_TEMP/regen/dl" --out "$RUNNER_TEMP/generator-gate"
      - name: Upload generator gate evidence and hosted cost
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: generator-gate-${{ matrix.lang }}-ubuntu-24.04
          path: |
            ${{ runner.temp }}/regen-cost.txt
            ${{ runner.temp }}/generator-gate-cost.txt
            ${{ runner.temp }}/generator-gate/report.json
            ${{ runner.temp }}/generator-gate/**/*.log
            ${{ runner.temp }}/generator-gate/**/*.command.json
            ${{ runner.temp }}/generator-gate/reference/data
            ${{ runner.temp }}/generator-gate/candidate/data
            ${{ runner.temp }}/generator-gate/large
          if-no-files-found: warn
          retention-days: 14
      - name: Pinned CLI integration tests (patched and unpatched inputs)
        if: ${{ matrix.lang == 'postgres' }}
        working-directory: tools/gen
        env:
          TREE_SITTER_CLI_ARCHIVE: ${{ runner.temp }}/regen/dl/tree-sitter-linux-x64.gz
        run: |
          test -s "$TREE_SITTER_CLI_ARCHIVE"
          go test -count=1 -timeout 60s -v ./grammarpatch -run '^(TestSyntheticGrammarRegeneration|TestUnpatchedGrammarRegeneration|TestJSONGrammarRegeneration)$'
      - name: Compare with the committed modules
        if: ${{ !cancelled() }}
        run: |
          git status --porcelain -- grammars/
          git diff --exit-code --stat -- grammars/
          test -z "$(git status --porcelain -- grammars/)"

  # Required check name kept until the ruleset requires regen-gate; skipped shards (docs-only and similar pull requests) pass.
  regen:
    name: regenerate and diff (ubuntu-24.04)
    if: ${{ always() }}
    needs: [changes, regen-grammar]
    runs-on: ubuntu-24.04
    steps:
      - name: All grammar shards matched
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          WANTED: ${{ needs.changes.outputs.regen }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              skipped) [ "$WANTED" != true ] || { echo "grammar shards were skipped but are needed"; exit 1; } ;;
              *) echo "a needed job ended $r"; exit 1 ;;
            esac
          done

  # The one required check of this workflow: red when the classifier or any job failed or was cancelled, green when every
  # job succeeded or was skipped on purpose (a skipped required check would otherwise pass even when its dependency failed).
  regen-gate:
    name: regen-gate
    if: ${{ always() }}
    needs: [changes, regen-grammar, regen]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -c 'map_values(.result)' <<<$NEEDS; jq -e --arg ok success --arg sk skipped '. as $n | all(.[]; .result == $ok or .result == $sk) and .changes.result == $ok and all(.changes.outputs.expect | fromjson[]; $n[.].result == $ok)' <<<$NEEDS
