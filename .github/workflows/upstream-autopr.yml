name: Upstream pin evidence (owner-local)

# Owner-local mode (S138, owner decision 2026-11-26): this workflow produces EVIDENCE and opens NO pull request. The owner (or
# an agent the owner instructs) downloads the artifacts, verifies them with tools/gen/autopr and opens the PR with gh; the
# runbook is "Owner-local pin move" in tools/gen/README.md. A GITHUB_TOKEN-opened PR comes only after the tag ruleset is hardened
# (ADR-0032 open decision 2); until then no job here has a write token. The file name is kept for upstreamwatch's dispatch hint.
#
# Scope of v1: ONE owner-repository grammar pin per run (ADR-0024 rule 7: java, javascript, typescript+tsx, tsql), to a stable
# release tag ahead of the pinned commit. tools/gen/pinbump refuses everything else. No tool, runtime or toolchain pin moves here.
#
# Two jobs, artifacts carry data only:
#   propose  permissions {}, no secret, no environment, no token. First-party Go only: pinbump resolves the tag (public API, read
#            only), downloads and hashes the archive IN MEMORY and edits pins.json; autopr checks that only that entry (and the
#            entries sharing its commit) changed. It executes no grammar, scanner or build script. The reviewer reads its run summary.
#   evidence permissions {}, no secret, environment autopr-untrusted (required reviewer: the owner; main only). THE APPROVAL
#            POINT before third-party code runs: tree-sitter generate, the scanner compile, wasm2go and the native C builds of
#            pin-move. LIMIT: these steps are NOT sandboxed yet (the bubblewrap generalisation, S97 H1, is open); the exposure
#            equals regen.yml/pin-move.yml on a pull request, minus the GITHUB_TOKEN, plus the approval. Uploads the regenerated
#            module directories and the evidence.
# Not used on purpose: pull_request_target, workflow_run, secrets, id-token, any cache (cache-mode: none as compare.yml), a
# write permission. Unauthenticated GitHub API calls share the runner's rate limit: a failed run can simply be dispatched again.
# The PR's required checks re-derive the generated bytes on other jobs: a tampered artifact shows as regenerate drift.

on:
  workflow_dispatch:
    inputs:
      grammar:
        description: Owner-repository grammar in tools/gen/pins.json (java, javascript, typescript, tsx or tsql)
        type: string
        required: true
      tag:
        description: Release tag of the pinned repository (for example v4.5.0)
        type: string
        required: true

permissions: {}

cache-mode: none

concurrency:
  group: upstream-autopr
  cancel-in-progress: false

env:
  GOENV: "off"
  GOWORK: "off"
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  GRAMMAR: ${{ inputs.grammar }}
  TAG: ${{ inputs.tag }}

jobs:
  propose:
    name: propose (no third-party code)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    cache-mode: none
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the inputs
        run: |
          [[ "$GRAMMAR" =~ ^[a-z0-9]+$ && "$TAG" =~ ^v?[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::grammar or tag has an unexpected form"; exit 1; }
      - name: Fetch the commit (no token, no action)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.27.x
          cache: false
      - name: Resolve the tag, hash the archive in memory, edit one pins.json entry
        run: |
          cd tools/gen
          go run ./pinbump -pins pins.json -grammar "$GRAMMAR" -tag "$TAG" -out "$RUNNER_TEMP/proposal" > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the proposal before anything uses it
        run: (cd tools/gen && go run ./autopr -main "$GITHUB_WORKSPACE" -proposal "$RUNNER_TEMP/proposal")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autopr-proposal
          path: ${{ runner.temp }}/proposal
          if-no-files-found: error
          retention-days: 7

  evidence:
    name: evidence (third-party code, owner approval)
    needs: propose
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {}
    cache-mode: none
    # Required reviewer = the owner; deployment branches = main. The reviewer sees the run summary of "propose".
    environment: autopr-untrusted
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the commit (no token, no action)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.27.x
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: autopr-proposal
          path: ${{ runner.temp }}/proposal
      - name: Re-check the proposal, then apply it to this throw-away checkout
        id: apply
        run: (cd tools/gen && go run ./autopr -main "$GITHUB_WORKSPACE" -proposal "$RUNNER_TEMP/proposal" -apply) | tee -a "$GITHUB_OUTPUT"
      - name: Regenerate the moved modules (third-party code, not sandboxed)
        env:
          GRAMMARS: ${{ steps.apply.outputs.grammars }}
        run: |
          [[ "$GRAMMARS" =~ ^[a-z0-9]+( [a-z0-9]+)*$ ]]
          mkdir -p "$RUNNER_TEMP/out"
          # $GRAMMARS is validated above: a space-separated list of module names.
          /usr/bin/time -v -o "$RUNNER_TEMP/out/regen-cost.txt" bash tools/gen/regen.sh "$RUNNER_TEMP/regen" $GRAMMARS
      - name: Collect only the module directories
        env:
          GRAMMARS: ${{ steps.apply.outputs.grammars }}
        run: |
          mkdir -p "$RUNNER_TEMP/regenerated/grammars"
          for g in $GRAMMARS; do cp -r "grammars/$g" "$RUNNER_TEMP/regenerated/grammars/$g"; done
          git status --porcelain > "$RUNNER_TEMP/out/git-status.txt"
          git diff --stat > "$RUNNER_TEMP/out/diff-stat.txt"
          cat "$RUNNER_TEMP/out/diff-stat.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autopr-regenerated
          path: ${{ runner.temp }}/regenerated
          if-no-files-found: error
          retention-days: 7
      - name: Pin-move evidence (old and new native trees; compare tools/gen/README.md "Pin-move CI evidence")
        run: |
          git add tools/gen/pins.json grammars
          git -c user.name=autopr -c user.email=autopr@invalid commit -q -m "local evidence commit"
          python3 tools/gen/pin-move.py --base "$GITHUB_SHA" --head "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/out/pin-move" --cache "$RUNNER_TEMP/pin-move-cache"
      - name: Publish the comparison summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/out/pin-move/summary.md" ]; then
            cat "$RUNNER_TEMP/out/pin-move/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Pin move report unavailable: an earlier step failed; inspect its log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: autopr-evidence
          path: |
            ${{ runner.temp }}/out
            !${{ runner.temp }}/out/**/work/**
            !${{ runner.temp }}/out/**/exe/**
            !${{ runner.temp }}/out/**/dl/**
            !${{ runner.temp }}/out/**/bin/**
          if-no-files-found: warn
          retention-days: 30
