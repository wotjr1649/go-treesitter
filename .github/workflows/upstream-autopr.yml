name: Upstream auto-PR (DRAFT, disabled)

# DRAFT (S97, 2026-11-26): trust-boundary design for automated upstream-update PRs. NOT ENABLED: workflow_dispatch only,
# and every job also needs the repository variable AUTOPR_ENABLED=true (unset) on a run of main. Enabling it is an owner
# decision (settings list: the S97 report, kept local); dependencies marked TODO do not exist yet.
#
# Scope of v1: ONE grammar pin per run, to a release tag of the repository already pinned (the bot never switches a source,
# never moves a tool/runtime pin: ADR-0024, AGENTS.md "one pin move per PR"; pin-move.py covers grammars only).
#
# Zones (each is a separate job; artifacts carry data only; nothing executes what an earlier job produced except as noted):
#   propose  permissions {}, no secret, no environment. First-party Go only: resolve the tag, download and hash the archive,
#            write pins.json/candidate.json/summary.md. It executes no grammar, scanner or build script. The owner reads the
#            run summary here.
#   evidence permissions {}, no secret, environment autopr-untrusted (required reviewer: the owner). THE APPROVAL POINT before
#            third-party code runs: tree-sitter generate, scanner compile, wasm2go, native C. Network only to fetch the
#            hash-verified inputs; the third-party steps run in a sandbox without network, token or environment.
#   open-pr  contents: write + pull-requests: write, no third-party code, no artifact executed. tools/gen/autopr validates the
#            artifacts (pins.json differs in one existing grammar entry; files only under grammars/<name>/; go.mod/go.sum
#            unchanged), then pushes auto/pin-<name>-<tag> by explicit refspec and opens the PR. Off unless
#            AUTOPR_OPEN_PR=true; otherwise the owner downloads the artifacts and runs the same `autopr -apply` locally.
# Not used on purpose: pull_request_target, workflow_run, secrets, id-token, any cache (cache-mode: none as compare.yml).
# A PR opened with GITHUB_TOKEN gets its pull_request workflows in the "approval-required" state: the owner starts them with
# "Approve workflows to run" (docs: trigger-a-workflow). The required checks then re-derive the generated bytes on other
# jobs: a tampered artifact shows as regenerate drift.

on:
  workflow_dispatch:
    inputs:
      grammar:
        description: Grammar name in tools/gen/pins.json (for example javascript)
        type: string
        required: true
      tag:
        description: Release tag of the pinned repository (for example v4.5.0)
        type: string
        required: true

permissions: {}

cache-mode: none

concurrency:
  group: upstream-autopr
  cancel-in-progress: false

env:
  GOENV: "off"
  GOWORK: "off"
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  GRAMMAR: ${{ inputs.grammar }}
  TAG: ${{ inputs.tag }}

jobs:
  propose:
    name: propose (no third-party code)
    if: ${{ github.ref == 'refs/heads/main' && vars.AUTOPR_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    cache-mode: none
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the inputs
        run: |
          [[ "$GRAMMAR" =~ ^[a-z0-9]+$ && "$TAG" =~ ^v?[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::grammar or tag has an unexpected form"; exit 1; }
      - name: Fetch the commit (no token, no action)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.27.x
          cache: false
      - name: Resolve the tag, download and hash the archive, edit one pins.json entry
        run: |
          # TODO(S97): tools/gen/pinbump does not exist yet. Contract: only grammar $GRAMMAR changes, its repo stays, the tag must
          # be a non-prerelease tag of that repo; downloads only from github.com over HTTPS (size-limited, tar entries refuse
          # links, absolute and parent paths); no network after the downloads; writes pins.json, candidate.json
          # ({"Kind":"grammar","Name","Tag","Commit"}) and summary.md (from->to commits, compare URL, owner-repository tier,
          # licence hash change, CHANGELOG link) into $RUNNER_TEMP/proposal. A tag without a GitHub Release is allowed (S94).
          (cd tools/gen && go run ./pinbump -pins pins.json -grammar "$GRAMMAR" -tag "$TAG" -out "$RUNNER_TEMP/proposal")
          cat "$RUNNER_TEMP/proposal/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the proposal before anything uses it
        run: (cd tools/gen && go run ./autopr -main "$GITHUB_WORKSPACE" -proposal "$RUNNER_TEMP/proposal")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autopr-proposal
          path: ${{ runner.temp }}/proposal
          if-no-files-found: error
          retention-days: 7

  evidence:
    name: evidence (third-party code, owner approval)
    needs: propose
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions: {}
    cache-mode: none
    # Required reviewer = the owner; deployment branches = main. The reviewer sees the run summary of "propose".
    environment: autopr-untrusted
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the commit (no token, no action)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.27.x
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: autopr-proposal
          path: ${{ runner.temp }}/proposal
      - name: Re-check the proposal, then apply it to this throw-away checkout
        run: (cd tools/gen && go run ./autopr -main "$GITHUB_WORKSPACE" -proposal "$RUNNER_TEMP/proposal" -apply)
      - name: Regenerate the module inside the sandbox
        run: |
          # TODO(S97): tools/gen/sandbox-regen.sh does not exist yet (generalises tools/gen/nightly-sandbox.sh, bubblewrap with
          # --unshare-all, empty environment, no token, read-only inputs, one writable output). Two phases: (1) fetch the
          # hash-verified inputs with the network (tools/gen/fetch.sh, no third-party code); (2) tree-sitter generate, the
          # scanner compile, wasm2go and the native C reference builds and runs inside the sandbox, output to $RUNNER_TEMP/out.
          # It must also leave pin-move.py's summary there (base = main, head = a local commit of the proposal).
          bash tools/gen/sandbox-regen.sh "$RUNNER_TEMP/regen" "$GRAMMAR" "$RUNNER_TEMP/out"
      - name: Collect only the module directory
        run: |
          mkdir -p "$RUNNER_TEMP/regenerated/grammars"
          cp -r "grammars/$GRAMMAR" "$RUNNER_TEMP/regenerated/grammars/$GRAMMAR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autopr-regenerated
          path: ${{ runner.temp }}/regenerated
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: autopr-evidence
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 30

  open-pr:
    name: open the pull request (no third-party code)
    needs: [propose, evidence]
    if: ${{ github.ref == 'refs/heads/main' && vars.AUTOPR_ENABLED == 'true' && vars.AUTOPR_OPEN_PR == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only write token of the workflow. Until the tag-creation ruleset covers v* and grammars/*/v* (ADR-0032 open decision 2)
    # a contents: write token can create a version tag: keep this job to first-party code and explicit refspecs.
    permissions:
      contents: write
      pull-requests: write
    cache-mode: none
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.27.x
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: autopr-proposal
          path: ${{ runner.temp }}/proposal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: autopr-regenerated
          path: ${{ runner.temp }}/regenerated
      - name: Validate and apply the data
        id: apply
        run: |
          (cd tools/gen && go run ./autopr -main "$GITHUB_WORKSPACE" -proposal "$RUNNER_TEMP/proposal" \
            -regenerated "$RUNNER_TEMP/regenerated" -apply) | tee -a "$GITHUB_OUTPUT"
      - name: Commit, push to a new auto/ branch and open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apply.outputs.name }}
          NEW_TAG: ${{ steps.apply.outputs.tag }}
          COMMIT: ${{ steps.apply.outputs.commit }}
        run: |
          set -euo pipefail
          branch="auto/pin-$NAME-$NEW_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tools/gen/pins.json "grammars/$NAME"
          git commit -q -m "pins: $NAME to $NEW_TAG ($COMMIT)"
          git push origin "HEAD:refs/heads/$branch" # explicit refspec, no force: refuses an existing branch
          # Fixed text and validated fields only: pin-move.yml reads this body (PIN-MOVE-ALLOW-OK-TO-ERROR lines), the bot never writes one.
          printf '%s\n' "Automatic pin move of \`$NAME\` to \`$NEW_TAG\` (\`$COMMIT\`)." "" \
            "Generated by .github/workflows/upstream-autopr.yml run $GITHUB_RUN_ID. Review: pins.json diff, the pin-move evidence, ADR-0024 tier, upstream CHANGELOG." \
            "Merge needs the owner's explicit authority (ADR-0019). Evidence workflows start after \"Approve workflows to run\"." > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "pins: $NAME to $NEW_TAG" --body-file "$RUNNER_TEMP/body.md"
