name: Upstream release watch

# Weekly: compares tools/gen/pins.json with upstream. A pinned tool or runtime (tree-sitter, wasi-sdk, binaryen, wasm2go)
# with a newer stable release fails the job. Every pinned repository is checked for rename/transfer, archive, deletion,
# reachability from default/release/other branch or tag, last-commit age and latest release; every grammar pin is also
# compared with nvim-treesitter's registry (information). Missing repos/orphan pins/API failures fail the job; rename,
# archive, age, newer stable release and nvim-treesitter differences are warnings: the job stays green and the
# "issue" job creates/updates ONE tracking issue (label upstream-watch), closing it when no unaccepted warning
# remains. The issue body also lists the pin-move candidates; the same list is the upstream-watch-candidates artifact
# (JSON with a version field). Nothing here dispatches a workflow. Accepted warnings retain their expiry in a separate table.
# Only runs on the default branch update the issue (manual runs elsewhere still write the step summary).
# It changes nothing else: pins move only with explicit authority (AGENTS.md).

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOENV: "off"
      GOWORK: "off"
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # patch ages come from the first-parent history of pins.json
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Unit tests of release comparison and repository health
        working-directory: tools/native-ref
        run: go test -count=1 ./upstreamwatch
      - name: Compare the pins with upstream
        working-directory: tools/native-ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/watch-out"
          cand="$RUNNER_TEMP/watch-candidates"
          mkdir -p "$out" "$cand"
          go build -o "$RUNNER_TEMP/upstreamwatch" ./upstreamwatch # `go run` would flatten the exit code to 1
          rc=0
          "$RUNNER_TEMP/upstreamwatch" -pins ../gen/pins.json -issue "$out/body.md" -state "$out/state" -candidates "$cand/candidates.json" > "$RUNNER_TEMP/watch.md" || rc=$?
          grep '^::' "$RUNNER_TEMP/watch.md" || true # error and warning annotations
          grep -v '^::' "$RUNNER_TEMP/watch.md" | tee -a "$GITHUB_STEP_SUMMARY"
          # A complete body also includes accepted/stale warnings; only unaccepted warnings prevent auto-close.
          if [ "$rc" -ge 2 ]; then echo error > "$out/state"; fi
          exit $rc
      - name: Upload the tracking-issue state
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: upstream-watch-issue
          path: ${{ runner.temp }}/watch-out
          if-no-files-found: warn
          retention-days: 1
      # Data only, for the owner or a later auto-PR workflow to read; this job dispatches nothing and gains no permission.
      - name: Upload the pin-move candidates
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: upstream-watch-candidates
          path: ${{ runner.temp }}/watch-candidates
          if-no-files-found: warn
          retention-days: 14

  # Separate job so that only it holds issues: write; it runs no repository code, only the gh CLI.
  issue:
    needs: watch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true # missing when the watch job died before writing it
        with:
          name: upstream-watch-issue
          path: ${{ runner.temp }}/watch-out
      - name: Create, update or close the tracking issue
        run: |
          out="$RUNNER_TEMP/watch-out"
          title="Upstream watch: grammar source health"
          label="upstream-watch"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # The shared issue follows the default branch only: a manual run on another branch or tag measures patch
          # ages from that ref's history. Scheduled runs are always on the default branch (the event SHA).
          # This job has no checkout, so name the repository explicitly (`gh repo view` without one reads local git).
          default=$(gh api "repos/$GH_REPO" --jq .default_branch)
          if [ -z "$default" ]; then echo "::error::default branch lookup failed"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != "$default" ]; then
            echo "run on $GITHUB_REF_NAME, not the default branch '$default': the tracking issue is left unchanged"
            exit 0
          fi
          state=$(cat "$out/state" 2>/dev/null || echo missing)
          if [ "$state" != warn ] && [ "$state" != clean ]; then
            echo "watch state '$state': the tracking issue is left unchanged"
            exit 0
          fi
          gh label create "$label" --force --color D93F0B --description "Automatic upstream grammar source health report" > /dev/null
          read -r num istate < <(gh issue list --label "$label" --state all --limit 1 --json number,state --jq '.[] | "\(.number) \(.state)"') || true
          { cat "$out/body.md"; printf '\n[Workflow run](%s)\n' "$run"; } > "$out/final.md"
          if [ "$state" = warn ]; then
            if [ -z "${num:-}" ]; then
              gh issue create --title "$title" --label "$label" --body-file "$out/final.md"
            else
              gh issue edit "$num" --title "$title" --body-file "$out/final.md"
              if [ "$istate" = CLOSED ]; then gh issue reopen "$num"; fi
            fi
          elif [ -n "${num:-}" ]; then
            gh issue edit "$num" --body-file "$out/final.md"
            if [ "$istate" = OPEN ]; then
              gh issue close "$num" --comment "No unaccepted upstream-watch warnings remain; closing ([workflow run]($run))."
            fi
          fi
