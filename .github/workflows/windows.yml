{
  "name": "Windows product lane",
  "on": {"push": {"branches": ["main"]}, "pull_request": {}, "workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "jobs": {
    "product": {
      "strategy": {"fail-fast": false, "matrix": {"include": [
        {"runner": "windows-latest", "arch": "amd64"},
        {"runner": "windows-11-arm", "arch": "arm64"}
      ]}},
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 15,
      "env": {"CGO_ENABLED": "0", "GOENV": "off", "GOWORK": "off", "GOTOOLCHAIN": "local"},
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-go@v7", "with": {"go-version": "1.27.x"}},
        {"name": "Native architecture", "run": "go env GOOS GOARCH CGO_ENABLED\n[Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture\nif ((go env GOOS) -ne 'windows' -or (go env GOARCH) -ne '${{ matrix.arch }}') { throw 'native target mismatch' }"},
        {"name": "Build", "run": "go build ./..."},
        {"name": "Vet", "run": "go vet ./..."},
        {"name": "Test", "run": "go test ./... -count=1 -timeout 120s"},
        {"name": "Local lane receipt tests", "run": "python -m unittest discover -s tools/lane -p test_*.py"},
        {
          "name": "Windows ARM64 build",
          "env": {"GOOS": "windows", "GOARCH": "arm64"},
          "run": "go build ./..."
        }
      ]
    },
    "licenses": {
      "runs-on": "windows-latest",
      "timeout-minutes": 5,
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"name": "License notices present", "run": "$expected = @('LICENSE', 'LICENSES/tree-sitter.txt') + (Get-ChildItem grammars -Directory | ForEach-Object { \"grammars/$($_.Name)/LICENSE\" })\n$missing = $expected | Where-Object { -not (Test-Path $_) }\nif ($missing) { throw \"missing license files: $missing\" }\n$expected\n$pins = Get-Content -Raw tools/gen/pins.json | ConvertFrom-Json\n$actual = (Get-FileHash -Algorithm SHA256 LICENSES/tree-sitter.txt).Hash.ToLowerInvariant()\nif ($actual -ne $pins.runtime.licenseSHA256) { throw \"runtime license hash mismatch: $actual\" }\n$manifest = Get-Content -Raw LICENSES/manifest.json | ConvertFrom-Json\nforeach ($entry in $manifest) {\n  $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $entry.path).Hash.ToLowerInvariant()\n  if ($actual -ne $entry.sha256) { throw \"license hash mismatch: $($entry.path)\" }\n}"}
      ]
    },
    "race": {
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "env": {"CGO_ENABLED": "1"},
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-go@v7", "with": {"go-version": "1.27.x"}},
        {"name": "Race diagnostic toolchain", "run": "go env GOOS GOARCH CGO_ENABLED\ngcc --version"},
        {"name": "Race diagnostic (root package and engine)", "run": "go test -race . ./internal/engine -count=1 -timeout=600s"}
      ]
    }
  }
}
