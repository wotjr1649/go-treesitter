{
  "name": "Windows product lane",
  "on": {"push": {"branches": ["main"]}, "pull_request": {}, "workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.run_attempt == 1 && 'main' || format('run-{0}-{1}', github.run_id, github.run_attempt) }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == 1 }}"
  },
  "jobs": {
    "changes": {
      "name": "windows-changes",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "outputs": {
        "windows_licenses": "${{ steps.classify.outputs.windows_licenses }}",
        "windows_race": "${{ steps.classify.outputs.windows_race }}",
        "expect": "${{ steps.classify.outputs.expect }}"
      },
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false, "fetch-depth": 2}},
        {"id": "classify", "name": "Classify the changed files (tools/lane/ci_changes.py)", "run": "python3 -m unittest discover -s tools/lane -p test_ci_changes.py\ncc=tools/lane/ci_changes.py ev=$GITHUB_EVENT_NAME\nif [ $ev = pull_request ]; then git show HEAD^1:$cc > $RUNNER_TEMP/base_ci_changes.py 2>/dev/null && cc=$RUNNER_TEMP/base_ci_changes.py || ev=workflow_dispatch; fi\npython3 $cc --workflow windows --event $ev"}
      ]
    },
    "licenses": {
      "needs": "changes",
      "if": "${{ needs.changes.outputs.windows_licenses == 'true' }}",
      "runs-on": "windows-latest",
      "timeout-minutes": 5,
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"name": "License notices present", "run": "$expected = @('LICENSE', 'LICENSES/tree-sitter.txt') + (Get-ChildItem grammars -Directory | ForEach-Object { \"grammars/$($_.Name)/LICENSE\" })\n$missing = $expected | Where-Object { -not (Test-Path $_) }\nif ($missing) { throw \"missing license files: $missing\" }\n$expected\n$pins = Get-Content -Raw tools/gen/pins.json | ConvertFrom-Json\n$actual = (Get-FileHash -Algorithm SHA256 LICENSES/tree-sitter.txt).Hash.ToLowerInvariant()\nif ($actual -ne $pins.runtime.licenseSHA256) { throw \"runtime license hash mismatch: $actual\" }\n$manifest = Get-Content -Raw LICENSES/manifest.json | ConvertFrom-Json\nforeach ($entry in $manifest) {\n  $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $entry.path).Hash.ToLowerInvariant()\n  if ($actual -ne $entry.sha256) { throw \"license hash mismatch: $($entry.path)\" }\n}"}
      ]
    },
    "race": {
      "needs": "changes",
      "if": "${{ needs.changes.outputs.windows_race == 'true' }}",
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "env": {"CGO_ENABLED": "1"},
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-go@v7", "with": {"go-version": "1.27.x"}},
        {"name": "Race diagnostic toolchain", "run": "go env GOOS GOARCH CGO_ENABLED\ngcc --version"},
        {"name": "Race diagnostic (root package and engine)", "run": "go test -race . ./internal/engine -count=1 -timeout=600s"}
      ]
    },
    "windows-gate": {
      "name": "windows-gate",
      "if": "${{ always() }}",
      "needs": ["changes", "licenses", "race"],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Every needed job passed or was skipped on purpose",
          "env": {"NEEDS": "${{ toJSON(needs) }}"},
          "run": "jq -c 'map_values(.result)' <<<$NEEDS; jq -e --arg ok success --arg sk skipped '. as $n | all(.[]; .result == $ok or .result == $sk) and .changes.result == $ok and all(.changes.outputs.expect | fromjson[]; $n[.].result == $ok)' <<<$NEEDS"
        }
      ]
    }
  }
}
