{
  "name": "Windows product lane",
  "on": {"push": {}, "pull_request": {}},
  "permissions": {"contents": "read"},
  "jobs": {
    "product": {
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "env": {"CGO_ENABLED": "0"},
      "steps": [
        {"uses": "actions/checkout@v7", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-go@v7", "with": {"go-version-file": "go.mod"}},
        {"name": "Build", "run": "go build ./..."},
        {"name": "Vet", "run": "go vet ./..."},
        {"name": "Test including recorded C comparisons", "run": "go test ./... -count=1"},
        {
          "name": "Windows ARM64 build",
          "env": {"GOOS": "windows", "GOARCH": "arm64"},
          "run": "go build ./..."
        }
      ]
    }
  }
}
